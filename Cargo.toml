[package]
name = "chonker8"  
version = "8.9.0"
edition = "2021"

[dependencies]
# Core CLI
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Configuration
toml = "0.8"

# Storage - Simple SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# File utilities
dirs = "5.0"

# Terminal UI for file browser
crossterm = "0.27"

# Efficient rope data structure for text editing
ropey = "1.6"

# Syntax highlighting for file types
syntect = "5.2"

[[bin]]
name = "chonker8"
path = "src/main.rs"