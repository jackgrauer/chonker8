[package]
name = "chonker8"  
version = "8.9.0"
edition = "2021"

[dependencies]
# Core CLI
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Configuration
toml = "0.8"

# Storage - Simple SQLite
rusqlite = { version = "0.32", features = ["bundled"] }

# File utilities
dirs = "5.0"

# GUI framework
eframe = "0.29"
egui = "0.29"

# Efficient rope data structure for text editing
ropey = "1.6"

# Syntax highlighting for file types
syntect = "5.2"

# Clipboard support
arboard = "3.3"

# HTML parsing and rendering
quick-xml = "0.38"
tempfile = "3.8"
regex = "1.10"

# CRF and ML for document structure
reqwest = { version = "0.11", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }

# Metal Document Classifier with Candle
candle-core = { version = "0.9", features = ["metal"] }
candle-nn = "0.9" 
candle-transformers = "0.9"
hf-hub = "0.4"
tokenizers = "0.20"

[[bin]]
name = "chonker8"
path = "src/main.rs"